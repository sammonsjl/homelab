---
# awx-operator reconciles the AWX sub-CR that ace-operator renders. ACE drives
# it rather than replacing it: it is the largest and best-tested piece of this
# stack, and forking it to save one install would be the wrong trade.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: awx-operator
  namespace: ace
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: awx-operator
      version: "3.x"
      sourceRef:
        kind: HelmRepository
        name: awx-operator
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    AWX:
      enabled: false
