---
# galaxy-operator manages a NetworkPolicy for the hub web tier, but the Role
# its manifests ship does not grant networkpolicies — so the reconcile gets to
# "Apply Hub web NetworkPolicy" and fails there, having already created
# everything before it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ace-component-operators-extra
  namespace: ace
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ace-component-operators-extra
  namespace: ace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ace-component-operators-extra
subjects:
  - kind: ServiceAccount
    name: galaxy-operator-sa
    namespace: ace
  - kind: ServiceAccount
    name: eda-server-operator-controller-manager
    namespace: ace
