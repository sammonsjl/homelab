# The Gateway API's CRDs (standard channel), which the Cloudflare tunnel controller works
# from. OpenShift ships them; EKS Anywhere doesn't.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.3.0/standard-install.yaml
