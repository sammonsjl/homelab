# Bahamut's names (*.apps-crc.testing) exist only on the laptop, so there is
# nothing for Let's Encrypt to check. A private CA instead: a self-signed
# root, and an issuer that signs with it.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bahamut-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: bahamut-ca
  secretName: bahamut-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: bahamut-ca
spec:
  ca:
    secretName: bahamut-ca
