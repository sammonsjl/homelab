# Needs the secret cloudflare-api-token in cert-manager (key: token), made by
# hand from Vault. See the README.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - certmanager.yaml
  - clusterissuers.yaml
  - certificates.yaml
  - console-hostname.yaml
  - serving-certs.yaml
