# Every route (console, OAuth login, apps) is served by the default ingress
# controller under *.apps; the API has its own name.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: apps-wildcard
  namespace: openshift-ingress
spec:
  secretName: apps-wildcard-tls
  dnsNames:
    - "*.apps.lud.neokube.net"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api
  namespace: openshift-config
spec:
  secretName: api-tls
  dnsNames:
    - api.lud.neokube.net
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
