# The driver's pods are privileged and mount host paths; on OpenShift that
# needs the privileged SCC. The chart knows nothing about SCCs.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:privileged
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: csi-nfs-controller-sa
    namespace: kube-system
  - kind: ServiceAccount
    name: csi-nfs-node-sa
    namespace: kube-system
