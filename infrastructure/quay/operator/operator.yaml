apiVersion: v1
kind: Namespace
metadata:
  name: quay
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: quay
  namespace: quay
spec:
  targetNamespaces:
    - quay
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: quay-operator
  namespace: quay
spec:
  name: quay-operator
  channel: stable-3.18
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  config:
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 1Gi}
