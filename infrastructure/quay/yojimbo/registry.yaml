# Quay, as a mirror of what this cluster installs from registry.redhat.io
# (Lab 7), at https://quay.neokube.net.
#
# Everything a mirror does not need is switched off: Clair (vulnerability
# scanning, the biggest part), the autoscaler, repository mirroring and the
# monitoring hooks. Its object storage is Garage (garage.yaml). Its route is
# the operator's, at SERVER_HOSTNAME in quay-config; its certificate is
# cert-manager's (certificate.yaml).
#
# Its config, which holds Garage's key, is the quay-config secret, made by hand.
apiVersion: quay.redhat.com/v1
kind: QuayRegistry
metadata:
  name: registry
  namespace: quay
spec:
  configBundleSecret: quay-config
  components:
    - kind: quay
      managed: true
      overrides:
        replicas: 1
        # Inside its pod Quay runs about 35 programs: gunicorn workers by the
        # node's CPU count (4 per CPU for the registry alone) and a background
        # worker for every feature. On lud's 8 threads that outgrew 4Gi in a
        # minute. A mirror needs the registry, the API and the cleanup of
        # unfinished uploads; QUAY_SERVICES starts only those.
        env:
          - name: QUAY_SERVICES
            value: dnsmasq,nginx,memcache,servicekey,gunicorn-registry,gunicorn-web,blobuploadcleanupworker,chunkcleanupworker,gcworker
          - {name: WORKER_COUNT_UNSUPPORTED_MINIMUM, value: "1"}
          - {name: WORKER_COUNT_REGISTRY, value: "2"}
          - {name: WORKER_COUNT_WEB, value: "1"}
        # The CPU limit keeps a busy Quay from slowing the site down.
        resources:
          requests: {cpu: 50m, memory: 1Gi}
          limits: {cpu: "1", memory: 2Gi}
    - kind: postgres
      managed: true
      overrides:
        # On lud's own disk, like Garage: what is in the mirror can be mirrored again.
        storageClassName: local-path
        resources:
          requests: {cpu: 20m, memory: 256Mi}
          limits: {memory: 1Gi}
    - kind: redis
      managed: true
      overrides:
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 512Mi}
    - kind: objectstorage
      managed: false
    - kind: route
      managed: true
    - kind: tls
      managed: false
      secretRef:
        name: quay-neokube-net-tls
    - kind: clair
      managed: false
    - kind: clairpostgres
      managed: false
    - kind: horizontalpodautoscaler
      managed: false
    - kind: mirror
      managed: false
    - kind: monitoring
      managed: false
