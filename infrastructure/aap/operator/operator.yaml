apiVersion: v1
kind: Namespace
metadata:
  name: aap
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: aap
  namespace: aap
spec:
  targetNamespaces:
    - aap
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: ansible-automation-platform-operator
  namespace: aap
spec:
  name: ansible-automation-platform-operator
  channel: stable-2.6
  source: aap-mirror
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  # Applies to all seven operator managers in the CSV (most idle here);
  # their default requests add up to ~1.4Gi.
  config:
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 2Gi}
