# The provisioner's helper pods mount a hostPath to create and delete volume
# directories. On OpenShift that needs the privileged SCC; the upstream
# manifests know nothing about SCCs.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: local-path-provisioner-scc-privileged
  namespace: local-path-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage
