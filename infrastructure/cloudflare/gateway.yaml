apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: cloudflare
spec:
  gatewayClassName: cloudflare
  listeners:
    - protocol: HTTP
      port: 80
      name: http
      # The site's HTTPRoute lives in its own namespace (ghost, apps/ghost/yojimbo), not here.
      allowedRoutes:
        namespaces:
          from: All
