# cloudflared runs as a fixed non-root UID, which needs nonroot-v2 instead of
# OpenShift's default random-UID policy.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: scc-nonroot-v2, namespace: cloudflare}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: "system:openshift:scc:nonroot-v2"}
subjects:
  - {kind: ServiceAccount, name: default, namespace: cloudflare}
