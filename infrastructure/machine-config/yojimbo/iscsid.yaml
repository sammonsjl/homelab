# synology-csi attaches LUNs with the host's iscsiadm, which needs the host's
# iscsid. RHCOS ships it switched off. iscsi-init.service (pulled in by iscsid)
# writes /etc/iscsi/initiatorname.iscsi on first start.
# lud is single-node: its role is master. Applying this reboots the node once.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-master-iscsid
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.2.0
    systemd:
      units:
        - name: iscsid.service
          enabled: true
