# OpenShift: privileged, hostNetwork and hostPath pods need the privileged SCC.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: synology-csi-privileged
  namespace: synology-csi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: csi-controller-sa
    namespace: synology-csi
  - kind: ServiceAccount
    name: csi-node-sa
    namespace: synology-csi
