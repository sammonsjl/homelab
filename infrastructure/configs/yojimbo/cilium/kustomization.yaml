apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/cilium/
  - ip-pool.yaml
  - redirect.yaml
patches:
  - path: httproute.yaml
    target:
      kind: HTTPRoute
      name: hubble
  - path: gateway.yaml
    target:
      kind: Gateway
      name: gateway
      namespace: kube-system
