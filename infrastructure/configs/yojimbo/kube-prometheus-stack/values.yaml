# NOTE: These must be set manually to the control plane IP addresses
# kubeEtcd:
#  endpoints:
#    - x.y.z.a
#    - x.y.z.b
#    - x.y.z.c
kubeControllerManager:
  service:
    selector:
      k8s-app: kube-controller-manager
kubeScheduler:
  service:
    selector:
      k8s-app: kube-scheduler

alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    podMonitorNamespaceSelector:
      matchLabels:
        app.kubernetes.io/component: monitoring

    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false

    # Sized from what it actually uses: about 30m CPU and 500Mi at this
    # cardinality and retention. The request is roughly double that, because
    # this is the one workload here that grows on its own as series accumulate.
    #
    # The memory limit is deliberately generous rather than tight. Prometheus
    # holds recent samples in memory, so being OOMKilled costs the WAL and
    # anything not yet compacted -- a limit that only just fits is worse than
    # no limit. No CPU limit: throttling a scraper makes it miss scrape
    # deadlines rather than simply run slower.
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi

grafana:
  # About 12m CPU and 395Mi across its three containers today, most of that
  # Grafana itself rather than the two config sidecars.
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 768Mi

  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

  grafana.ini:
    date_formats:
      default_week_start: monday

  envFromSecret: db-passwords

  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
      provider:
        allowUiUpdates: true

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Ghost DB
          type: mysql
          url: mysql.mysql.svc.cluster.local:3306
          user: ghost
          uid: ghost
          secureJsonData:
            password: $GHOST_DB_PASSWORD
          jsonData:
            database: ghost
            sslmode: disable
            maxOpenConns: 100
            maxIdleConns: 100
            maxLifetime: 14400
            minIdleTimeoutMinutes: 1
            connMaxLifetime: 14400
            postgresVersion: 1500
            timescaledb: false
          version: 1
          editable: true
      deleteDatasources:
        - name: Ghost DB
          orgId: 1

  persistence:
    accessModes:
      - ReadWriteOnce
    enabled: true
    size: 4Gi
    storageClass: local-path
    type: pvc

  route:
    main:
      enabled: true
      annotations:
        gethomepage.dev/app: grafana
        gethomepage.dev/enabled: "true"
        gethomepage.dev/description: Grafana CMS
        gethomepage.dev/group: Homelab
        gethomepage.dev/icon: grafana.png
        gethomepage.dev/name: Grafana
        gethomepage.dev/statusStyle: dot
      hostnames:
        - grafana.neokube.net
      parentRefs:
        - name: gateway
          namespace: kube-system

# The rest of the stack: small, steady, and previously requesting nothing at
# all, which left the scheduler unable to account for any of it.
kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
