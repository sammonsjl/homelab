---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.22.0
          envFrom:
            - secretRef:
                name: pihole
          args:
            - --log-level=info
            - --source=gateway-httproute
            # ACE's front door is a LoadBalancer Service, not an HTTPRoute:
            # envoy terminates its own TLS, so it cannot ride the shared
            # HTTP gateway. Without this source its name is never published.
            - --source=service
            - --registry=noop
            - --policy=upsert-only
            - --provider=pihole
            # --pihole-api-version was removed in external-dns 0.22; the
            # provider detects the Pi-hole API version itself now, and
            # passing it is a fatal flag-parsing error.
            - --pihole-server=http://192.168.1.11:80
            - --pihole-tls-skip-verify
      securityContext:
        fsGroup: 65534
