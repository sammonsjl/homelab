# The same Cloudflare API token the tunnel controller uses (Vault
# secrets/cloudflare); it can edit DNS in the neokube.net zone, which is all
# DNS-01 needs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
  data:
    - secretKey: token
      remoteRef:
        key: secrets/cloudflare
        property: TOKEN
