---
# Both passwords come from the same Vault path ghost already used, so the
# application password does not change and Ghost keeps working with the
# credentials it has. root-password was added alongside it for the server's
# own account.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql
  namespace: mysql
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: mysql
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: secrets/ghost
        property: root-password
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: secrets/ghost
        property: password
