apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/synology-csi/
# Dev volumes are disposable: delete the LUN with the claim, rather than
# prod's Retain, so rebuilding bahamut never strands LUNs on the NAS.
patches:
  - target:
      kind: StorageClass
      name: synology-iscsi
    patch: |-
      - op: replace
        path: /reclaimPolicy
        value: Delete
