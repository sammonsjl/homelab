# Pin the shared HTTP gateway to the first address in the pool, as on yojimbo,
# so the external-dns records stay put whatever order LoadBalancers come up in.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: kube-system
spec:
  addresses:
    - type: IPAddress
      value: 192.168.150.100
