apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/
configMapGenerator:
  - name: homepage-config
    namespace: homepage
    behavior: merge
    files:
      - services.yaml
patches:
  - target:
      kind: Route
      name: homepage
    patch: |
      - op: add
        path: /spec/host
        value: homepage.apps-crc.testing
