- Yojimbo:
    - OpenShift console:
        href: https://lud.neokube.net
        icon: openshift.png
        description: Single-node OpenShift on lud
    - Argo CD:
        href: https://openshift-gitops-server-openshift-gitops.apps.lud.neokube.net
        icon: argo-cd.png
        description: What git says this cluster should run
    - Ansible Automation Platform:
        href: https://aap.neokube.net
        icon: ansible.png
        description: Runs the nightly backup of neokube.net
    - NeoKube:
        href: https://neokube.net
        # The icon set Homepage draws from has none for Liferay, so this is the
        # site's own.
        icon: https://neokube.net/o/neokube-favicon/favicon.svg
        description: The site
    - Uptime Kuma:
        href: https://uptime.neokube.net
        icon: uptime-kuma.png
        description: Checks that things answer
    - Headlamp:
        href: https://headlamp.neokube.net
        icon: headlamp.png
        description: A web UI for the cluster
- Network and storage:
    - Pi-hole:
        href: http://192.168.1.11:80/admin
        icon: pi-hole.png
        widget:
          type: pihole
          url: http://192.168.1.11:80
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"
    - Synology:
        href: https://192.168.1.4:5001
        icon: synology.png
        widget:
          type: diskstation
          # Straight to DSM on 5001, like the link above.
          url: https://192.168.1.4:5001
          username: "{{HOMEPAGE_VAR_SYNOLOGY_USERNAME}}"
          password: "{{HOMEPAGE_VAR_SYNOLOGY_PASSWORD}}"
          # DSM's own name for it, as the storage API reports it.
          volume: volume_1
