apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/
  - certificate.yaml
configMapGenerator:
  - name: homepage-config
    namespace: homepage
    behavior: merge
    files:
      - services.yaml
      # Cluster and node figures. They come from the metrics API, which
      # OpenShift Local leaves switched off, so only lud shows them.
      - widgets.yaml
patches:
  - target:
      kind: Route
      name: homepage
    patch: |
      - op: add
        path: /spec/host
        value: home.neokube.net
      - op: add
        path: /spec/tls/externalCertificate
        value:
          name: home-neokube-net-tls
  # The Pi-hole and Synology widgets sign in to what they show. Their
  # credentials are the homepage-widgets Secret, made by hand from Vault (see
  # the README); Homepage puts every HOMEPAGE_VAR_ variable into its config
  # where services.yaml names it. Optional, so the portal starts without it.
  - target:
      kind: Deployment
      name: homepage
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - secretRef:
              name: homepage-widgets
              optional: true
