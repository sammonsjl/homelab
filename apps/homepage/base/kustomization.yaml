apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
  - clusterrole.yaml
  - deployment.yaml
  - namespace.yaml
  - route.yaml
  - service.yaml
  - serviceaccount.yaml
# Each cluster adds its own services.yaml to this (behavior: merge).
configMapGenerator:
  - name: homepage-config
    files:
      - config/bookmarks.yaml
      - config/custom.css
      - config/custom.js
      - config/docker.yaml
      - config/kubernetes.yaml
      - config/settings.yaml
      - config/widgets.yaml
