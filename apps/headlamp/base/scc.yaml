# The chart runs Headlamp as user 100, the user its image is built for.
# OpenShift's default SCC only admits a UID from the namespace's own range, so
# the pod is refused until its service account may use nonroot-v2: any UID but
# root, and nothing else beyond the default.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:nonroot-v2
  namespace: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
