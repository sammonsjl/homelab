---
# Picked up by the Grafana sidecar, which watches ConfigMaps labelled
# grafana_dashboard=1 in the monitoring namespace.
#
# Built only on series confirmed present in Prometheus: the controller's own
# awx_* metrics via the ServiceMonitor alongside this, plus kube-state-metrics
# and cAdvisor for health and resource use. Nothing here renders "No data" on
# a working cluster.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ace-platform-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: ace
data:
  ace-platform.json: |
    {
      "uid": "ace-platform",
      "title": "ACE Platform",
      "description": "The ACE automation platform: component health, job execution, and what the controller is holding. Metrics come from the controller's own endpoint, scraped through the gateway.",
      "tags": [
        "ace",
        "automation"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "Platform health",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Gateway",
          "description": "Available replicas of ace-gateway. 0 means the component is down.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kube_deployment_status_replicas_available{namespace=\"ace\",deployment=\"ace-gateway\"}",
              "legendFormat": "",
              "refId": "A",
              "editorMode": "code",
              "range": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
