apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ghost
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Ghost CMS
    gethomepage.dev/group: Homelab
    gethomepage.dev/icon: ghost.png
    gethomepage.dev/name: Ghost
    gethomepage.dev/statusStyle: dot
  namespace: cloudflare
  labels:
    app.kubernetes.io/name: ghost
spec:
  hostnames:
    - neokube.net
  parentRefs:
    - name: gateway
      namespace: cloudflare
  # Both rules, because a patch replaces the base's list. /pulse/ is the
  # cluster summary the theme polls (apps/base/pulse); the longer prefix wins.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pulse/
      backendRefs:
        - kind: Service
          name: pulse
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: ghost
          port: 2368
