# Ghost's database: one MySQL 8.4, the official image, with nothing about
# users or groups in it. OpenShift picks both.
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ghost
  labels:
    app.kubernetes.io/name: mysql
spec:
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: ghost
  labels:
    app.kubernetes.io/name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
    spec:
      containers:
        - name: mysql
          image: docker.io/library/mysql:8.4.11
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_general_ci
            # The two settings that decide most of MySQL's memory. The
            # defaults (a 128 MB buffer pool, and performance_schema's own
            # buffers) are sized for a server, not for one small blog.
            - --innodb-buffer-pool-size=64M
            - --performance-schema=OFF
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: ghost-db, key: root-password}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: ghost-db, key: password}
            - name: MYSQL_DATABASE
              value: ghost
            - name: MYSQL_USER
              value: ghost
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
