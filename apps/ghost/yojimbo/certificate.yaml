# neokube.net from the LAN: the LAN's DNS answers neokube.net with lud's
# address, so machines at home skip Cloudflare and its Access login. The name
# is outside *.apps.lud.neokube.net, so it has a certificate of its own, which
# the Route names; the router may read it only because a Role lets it.
#
# Wave -1: Argo CD waits for the Certificate to be Ready before it changes the
# Route, which the API refuses while the Secret is missing.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: neokube-net
  namespace: ghost
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretName: neokube-net-tls
  dnsNames:
    - neokube.net
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-read-neokube-net-tls
  namespace: ghost
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [neokube-net-tls]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-read-neokube-net-tls
  namespace: ghost
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-read-neokube-net-tls
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
