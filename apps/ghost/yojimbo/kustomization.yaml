# neokube.net on lud: the same Ghost and MySQL as Bahamut's (apps/ghost/base),
# with production's address. The site's content is not here: it is synced into
# Ghost from neokube/content in the Social Office workspace
# (scripts/neokube-ghost-sync.py), and the theme and redirects are files on the
# content volume (README).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/
  - certificate.yaml
  - httproute.yaml
patches:
  - target:
      kind: Route
      name: ghost
    patch: |
      - op: add
        path: /spec/host
        value: neokube.net
      - op: add
        path: /spec/tls/externalCertificate
        value:
          name: neokube-net-tls
  - target:
      kind: Deployment
      name: ghost
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: url
          value: https://neokube.net
