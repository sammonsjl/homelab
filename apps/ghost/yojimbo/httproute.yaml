# neokube.net from the internet: through the Cloudflare tunnel
# (infrastructure/cloudflare), which also makes the DNS record.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: neokube-net
  namespace: ghost
spec:
  hostnames:
    - neokube.net
  parentRefs:
    - name: gateway
      namespace: cloudflare
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {kind: Service, name: ghost, port: 2368}
