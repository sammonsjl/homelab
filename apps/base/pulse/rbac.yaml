# pulse reads, never writes: nodes, events, the Flux sync state, the ACE
# platform and its pods, and the cilium DaemonSet for its version. No
# secrets, no configmaps, no pod specs beyond the ace namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulse
  namespace: ghost
  labels:
    app.kubernetes.io/name: pulse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pulse
  labels:
    app.kubernetes.io/name: pulse
rules:
  - apiGroups: [""]
    resources: [nodes, events]
    verbs: [get, list]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories]
    verbs: [get, list]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pulse
  labels:
    app.kubernetes.io/name: pulse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pulse
subjects:
  - kind: ServiceAccount
    name: pulse
    namespace: ghost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pulse
  namespace: kube-system
  labels:
    app.kubernetes.io/name: pulse
rules:
  - apiGroups: [apps]
    resources: [daemonsets]
    resourceNames: [cilium]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pulse
  namespace: kube-system
  labels:
    app.kubernetes.io/name: pulse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pulse
subjects:
  - kind: ServiceAccount
    name: pulse
    namespace: ghost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pulse
  namespace: ace
  labels:
    app.kubernetes.io/name: pulse
rules:
  - apiGroups: [automation.ace.io]
    resources: [automationplatforms]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pulse
  namespace: ace
  labels:
    app.kubernetes.io/name: pulse
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pulse
subjects:
  - kind: ServiceAccount
    name: pulse
    namespace: ghost
