apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse
  namespace: ghost
  labels:
    app.kubernetes.io/name: pulse
spec:
  replicas: 1
  revisionHistoryLimit: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: pulse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse
    spec:
      serviceAccountName: pulse
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pulse
          image: docker.io/library/python:3.13-alpine
          command: [python, /app/pulse.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /pulse/healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /pulse/healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: pulse
