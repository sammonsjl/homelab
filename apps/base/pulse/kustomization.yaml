apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Lives in the ghost namespace so the site's HTTPRoute can send /pulse/ here.
# No kustomize `namespace:` — the Roles below live in kube-system and ace,
# and every resource names its own namespace.
resources:
  - rbac.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: pulse
    namespace: ghost
    files:
      - pulse.py
    options:
      labels:
        app.kubernetes.io/name: pulse
