apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: homepage-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        kubernetes.yaml: |
          mode: cluster
          gateway: true
        settings.yaml: |
          background: http://192.168.1.4:8080/deathstranding.png
        custom.css: ""
        custom.js: ""
        bookmarks.yaml: ""
        services.yaml: |
          - Widgets:
            - Pi-hole:
                  href: http://192.168.1.11:80/admin
                  icon: pi-hole.png
                  widget:
                    type: pihole
                    url: http://192.168.1.11:80
                    version: 6
                    key: {{ .piholekey }}
            - Proxmox:
                  href: https://lud.neokube.net 
                  icon: proxmox.png
                  widget:
                    type: proxmox
                    # Straight to the node, not through the npm.neokube.net
                    # proxy the link uses. Homepage skips certificate checks
                    # for widget calls, so Proxmox's own cert is fine. The
                    # credentials are homepage@pve!homepage, a PVEAuditor
                    # (read-only) API token.
                    url: https://192.168.1.2:8006
                    username: {{ .proxmoxusername }}
                    password: {{ .proxmoxpassword }}
                    node: lud 
            - Synology:
                  href: https://darktower.neokube.net
                  icon: synology.png
                  widget:
                    type: diskstation
                    # Straight to DSM on 5001. darktower.neokube.net goes
                    # through the npm.neokube.net proxy, which answers 502 for
                    # it.
                    url: https://192.168.1.4:5001
                    username: {{ .synologyusername }}
                    password: {{ .synologypassword }}
                    # DSM's own name for it, as the storage API reports it.
                    volume: volume_1
        widgets.yaml: |
          - kubernetes:
              cluster:
                show: true
                cpu: true
                memory: true
                showLabel: true
                label: "cluster"
              nodes:
                show: true
                cpu: true
                memory: true
                showLabel: true
          - resources:
              backend: resources
              expanded: true
              cpu: true
              memory: true
              network: default
          - search:
              provider: duckduckgo
              target: _blank
        docker.yaml: ""
  data:
    - secretKey: piholekey
      remoteRef:
        key: secrets/pihole
        property: piholekey
    - secretKey: synologyusername
      remoteRef:
        key: secrets/synology
        property: username
    - secretKey: synologypassword
      remoteRef:
        key: secrets/synology
        property: password
    - secretKey: proxmoxusername
      remoteRef:
        key: secrets/proxmox
        property: username
    - secretKey: proxmoxpassword
      remoteRef:
        key: secrets/proxmox
        property: password
