apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/
  - certificate.yaml
patches:
  - target:
      kind: Route
      name: uptime-kuma
    patch: |
      - op: add
        path: /spec/host
        value: uptime.neokube.net
      - op: add
        path: /spec/tls/externalCertificate
        value:
          name: uptime-neokube-net-tls
