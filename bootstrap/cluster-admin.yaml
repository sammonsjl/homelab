# The operator's own Argo CD instance (namespace openshift-gitops) may only
# touch a short list of cluster resources. This repo holds operators, storage
# classes, SCC bindings and a MachineConfig, so its controller gets the lot.
# The service account does not exist until the operator has created the
# instance; a binding to a subject that appears later is fine.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-gitops-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
