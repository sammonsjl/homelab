# lud's EKS Anywhere cluster (six Bottlerocket nodes), which also runs monitoring-poc from
# that repository's own Argo CD Applications. This one Application brings in neokube.net and
# what it needs (clusters/eksa-lud/apps). Applied once, by hand:
#   kubectl apply -f clusters/eksa-lud/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sammonsjl/homelab.git
    targetRevision: eksa-lud
    path: clusters/eksa-lud/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
