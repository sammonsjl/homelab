---
# The component operators ACE hands sub-CRs to. They reconcile Galaxy and EDA
# the way awx-operator reconciles AWX; ACE drives them rather than replacing
# them, so their CRDs have to exist before a platform enables those components.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: galaxy-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: galaxy-operator
  path: ./config/default
  prune: true
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: eda-server-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: eda-server-operator
  path: ./config/default
  prune: true
  wait: false
