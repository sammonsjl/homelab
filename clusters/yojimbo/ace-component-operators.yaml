---
# The component operators ACE hands sub-CRs to. They reconcile Galaxy and EDA
# the way awx-operator reconciles AWX; ACE drives them rather than replacing
# them, so their CRDs have to exist before a platform enables those components.
#
# Both need two corrections to their shipped manifests:
#
#   gcr.io/kubebuilder/kube-rbac-proxy no longer exists — Google removed that
#   registry — so the sidecar cannot pull and the controller never starts.
#
#   WATCH_NAMESPACE comes from a fieldRef to the operator's own namespace, so
#   each watches only where it is installed and silently ignores CRs anywhere
#   else, logging "Watching namespaces: [galaxy]" and then nothing at all.
#   Empty means every namespace, which the cluster-wide RBAC in
#   infrastructure/controllers/yojimbo/ace grants them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: galaxy-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: galaxy-operator
  path: ./config/default
  prune: true
  wait: false
  patches:
    - target:
        kind: Deployment
        name: .*controller-manager
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ignored
        spec:
          template:
            spec:
              containers:
                - name: kube-rbac-proxy
                  image: quay.io/brancz/kube-rbac-proxy:v0.15.0
                - name: galaxy-operator
                  env:
                    - name: WATCH_NAMESPACE
                      value: ""
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: eda-server-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: eda-server-operator
  path: ./config/default
  prune: true
  wait: false
  patches:
    - target:
        kind: Deployment
        name: .*controller-manager
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ignored
        spec:
          template:
            spec:
              containers:
                - name: kube-rbac-proxy
                  image: quay.io/brancz/kube-rbac-proxy:v0.15.0
                - name: eda-manager
                  env:
                    - name: WATCH_NAMESPACE
                      value: ""
