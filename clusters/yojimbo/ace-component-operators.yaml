---
# The component operators ACE hands sub-CRs to. They reconcile Galaxy and EDA
# the way awx-operator reconciles AWX; ACE drives them rather than replacing
# them, so their CRDs have to exist before a platform enables those components.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: galaxy-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: galaxy-operator
  path: ./config/default
  prune: true
  wait: false
  # gcr.io/kubebuilder/kube-rbac-proxy no longer exists — Google removed that
  # registry, so both operators ship a manifest that cannot pull. brancz's quay
  # mirror is the image the project moved to, and is what awx-operator already
  # uses in this cluster.
  patches:
    - target:
        kind: Deployment
        name: .*controller-manager
      patch: |
        - op: replace
          path: /spec/template/spec/containers/0/image
          value: quay.io/brancz/kube-rbac-proxy:v0.15.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
