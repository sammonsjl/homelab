---
# The component operators ACE hands sub-CRs to. They reconcile Galaxy and EDA
# the way awx-operator reconciles AWX; ACE drives them rather than replacing
# them, so their CRDs have to exist before a platform enables those components.
#
# Both need two corrections to their shipped manifests:
#
#   gcr.io/kubebuilder/kube-rbac-proxy no longer exists — Google removed that
#   registry — so the sidecar cannot pull and the controller never starts.
#
#   WATCH_NAMESPACE comes from a fieldRef to the operator's own namespace, so
#   each watches only where it is installed. Setting it empty does NOT widen
#   that in this operator-sdk build — it still resolves to the pod's namespace
#   and logs "Watching namespaces: [galaxy]". So they are installed INTO the
#   platform's namespace instead, which is where awx-operator already runs and
#   why that one worked from the start.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: galaxy-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: galaxy-operator
  path: ./config/default
  targetNamespace: ace
  prune: true
  wait: false
  patches:
    - target:
        kind: Deployment
        name: .*controller-manager
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ignored
        spec:
          template:
            spec:
              containers:
                - name: kube-rbac-proxy
                  image: quay.io/brancz/kube-rbac-proxy:v0.15.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: eda-server-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: eda-server-operator
  path: ./config/default
  targetNamespace: ace
  prune: true
  wait: false
  patches:
    - target:
        kind: Deployment
        name: .*controller-manager
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ignored
        spec:
          template:
            spec:
              containers:
                - name: kube-rbac-proxy
                  image: quay.io/brancz/kube-rbac-proxy:v0.15.0
