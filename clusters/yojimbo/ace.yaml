---
# The ACE operator, installed from the chart in the repo that owns it, so its
# CRD, RBAC and Deployment never drift from the reconcile code they run.
#
# This used to apply the kustomize base at ./config. Both still exist and are
# kept identical by CI; the chart is what the cluster uses because it is what
# anyone else installing ACE would use, and it is worth exercising the same
# path they do.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ace-operator
  # The HelmRelease itself lives in flux-system. Putting it in ace-system
  # cannot work on a fresh cluster: Flux has to create the object before
  # anything has created that namespace, and install.createNamespace only
  # covers the release's target, not where the resource is declared.
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  targetNamespace: ace-system
  storageNamespace: ace-system
  install:
    createNamespace: true
    crds: Create
  upgrade:
    # Helm never upgrades a CRD it installed from crds/. CreateReplace makes
    # Flux apply schema changes that the chart alone would silently skip.
    crds: CreateReplace
  chart:
    spec:
      chart: ./charts/ace
      sourceRef:
        kind: GitRepository
        name: ace-operator
        namespace: flux-system
      interval: 10m
      # Repackage whenever the git revision moves, not only when the chart
      # version does. The default is ChartVersion, which means edits to the
      # templates never reach the cluster unless someone also bumps
      # Chart.yaml -- the RBAC fix was applied, upgraded to v2, and still
      # served the old rules.
      reconcileStrategy: Revision
  values:
    operator:
      image:
        tag: "20260911-b5a4b17"
