# neokube.net: Ghost and its MySQL (apps/ghost/yojimbo). The Secret ghost-db
# with the two database passwords is made by hand first, as on Bahamut.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ghost
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/sammonsjl/homelab.git
    targetRevision: openshift-gitops
    path: apps/ghost/yojimbo
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
