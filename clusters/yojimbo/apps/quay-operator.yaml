# The Red Hat Quay operator, from OperatorHub. Quay is the mirror AAP installs from.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quay-operator
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/sammonsjl/homelab.git
    targetRevision: openshift-gitops
    path: infrastructure/quay/operator
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
