# The platform itself: one AnsibleAutomationPlatform resource and its certificate.
# Waits for the operator's kinds, cert-manager's and the synology-iscsi class.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aap
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/sammonsjl/homelab.git
    targetRevision: openshift-gitops
    path: infrastructure/aap/yojimbo
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - SkipDryRunOnMissingResource=true
