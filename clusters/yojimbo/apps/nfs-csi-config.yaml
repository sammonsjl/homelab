# The nfs-csi storage class and the driver's SCC binding. The driver is nfs-csi.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-csi-config
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/sammonsjl/homelab.git
    targetRevision: openshift-gitops
    path: infrastructure/nfs-csi/yojimbo
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
