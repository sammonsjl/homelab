# Volumes on lud's own disk.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-path
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/sammonsjl/homelab.git
    targetRevision: openshift-gitops
    path: infrastructure/local-path
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
