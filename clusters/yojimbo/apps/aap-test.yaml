# A second platform, in namespace aap-test, with its own operator: for trying
# changes before they go to the one in aap.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aap-test
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/sammonsjl/homelab.git
    targetRevision: openshift-gitops
    path: infrastructure/aap/test
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - SkipDryRunOnMissingResource=true
