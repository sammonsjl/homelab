# Uptime Kuma, from its Helm chart: checks that things answer, and keeps the
# history. Its namespace and Route are uptime-kuma-config.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uptime-kuma
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://helm.irsigler.cloud
    chart: uptime-kuma
    targetRevision: 4.2.0
    helm:
      releaseName: uptime-kuma
      valuesObject:
        # Monitors and their history are a SQLite file on a volume of the
        # cluster's default class. Naming the database skips the first page,
        # which asks whether to use MariaDB.
        volume:
          size: 1Gi
        podEnv:
          - name: UPTIME_KUMA_DB_TYPE
            value: sqlite
        # The volume is ReadWriteOnce: the old pod has to let go of it before
        # the new one starts.
        strategy:
          type: Recreate
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 384Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: uptime-kuma
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 3m
