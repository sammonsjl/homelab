# What the nightly backup of neokube.net (Liferay on lud) needs in the cluster.
#   oc apply -f ansible/files/lud-backup-access.yaml
#
# 1. An identity for the backup and restore jobs, limited to the liferay
#    namespace: read pods and statefulsets, run commands in the pods, read the
#    two secrets a restore needs, and -- for the restore job -- stop and start
#    the statefulsets and change their settings.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup
  namespace: liferay
---
# A token that does not expire, for the AAP credential.
apiVersion: v1
kind: Secret
metadata:
  name: backup-token
  namespace: liferay
  annotations:
    kubernetes.io/service-account.name: backup
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup
  namespace: liferay
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # patch and scale are for "Restore neokube.net": it stops Liferay while the
  # database is replaced, and has it rebuild the search index at the next start.
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, patch]
  - apiGroups: [apps]
    resources: [statefulsets/scale]
    verbs: [get, patch, update]
  # Running commands in a pod (pg_dump, tar) and copying the result out.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [liferay-default, liferay-database]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup
  namespace: liferay
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup
subjects:
  - kind: ServiceAccount
    name: backup
    namespace: liferay
---
# 2. Where the backups go: their own NFS volume on the NAS, made by nfs-csi:
#    192.168.1.4:/volume1/k8s-nfs-yojimbo/lud/aap-neokube-backups
#    The job pods in the aap namespace mount it at /backups. The class keeps
#    the folder if this claim is ever deleted (Retain).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neokube-backups
  namespace: aap
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 20Gi
