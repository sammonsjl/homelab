# Builds images/synology-csi -- synology-csi compiled from its release tag, plus
# its own iscsiadm, so the node plugin works under Talos workload isolation.
# See the Containerfile.
#
# Published as ghcr.io/<owner>/synology-csi-talos, not synology-csi: that name
# is an older package pushed by hand, which this repo's workflow has no write
# access to.
#
# Tags: <version>-<commit> (immutable; pin this one) and <version>, where the
# version is the Containerfile's SYNOLOGY_CSI_VERSION.

name: synology-csi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "images/synology-csi/**"
      - ".github/workflows/synology-csi.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/synology-csi-talos"
          version=$(sed -n 's/^ARG SYNOLOGY_CSI_VERSION=//p' images/synology-csi/Containerfile)
          echo "ref=${image}:${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tags=${image}:${version}-${GITHUB_SHA::7},${image}:${version}" >> "$GITHUB_OUTPUT"

      # The Talos nodes are amd64.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/synology-csi
          file: images/synology-csi/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      # Fail the run if the image does not carry the one thing it exists for --
      # and at exactly the open-iscsi release the Containerfile pins, since a
      # mismatch with the node's iscsid hangs iscsid rather than erroring.
      - name: Check iscsiadm is in the image, at the pinned version
        run: |
          ref="${{ steps.meta.outputs.ref }}"
          want=$(sed -n 's/^ARG OPEN_ISCSI_VERSION=//p' images/synology-csi/Containerfile)
          got=$(docker run --rm --entrypoint iscsiadm "$ref" --version)
          echo "$got"
          [ "$got" = "iscsiadm version ${want}" ] || { echo "::error::expected iscsiadm ${want}, got: ${got}"; exit 1; }
          docker run --rm --entrypoint sh "$ref" -c \
            'test ! -e /etc/iscsi/initiatorname.iscsi && echo "no baked initiator name"'

      # The driver itself, and blockdev: v1.4.0 runs it to flush a device before
      # logging the session out, and an image without it fails every unstage.
      - name: Check the driver runs and its tools are present
        run: |
          ref="${{ steps.meta.outputs.ref }}"
          docker run --rm "$ref" --help | head -1
          docker run --rm --entrypoint sh "$ref" -c \
            'for c in blockdev mkfs.ext4 mkfs.xfs blkid resize2fs; do command -v $c || exit 1; done'
